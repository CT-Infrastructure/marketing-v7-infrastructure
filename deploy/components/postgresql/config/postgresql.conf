# Reviewed template; server image/UID/path compatibility remains unresolved.
listen_addresses = '*'
port = 5432
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/run/secrets/server.crt'
ssl_key_file = '/run/secrets/server.key'
password_encryption = 'scram-sha-256'
hba_file = '/etc/postgresql/pg_hba.conf'
unix_socket_directories = '/run/postgresql'
shared_buffers = '128MB'
max_connections = 30
work_mem = '4MB'
maintenance_work_mem = '64MB'
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=cp027 archive-push %p'
logging_collector = off
log_statement = 'none'
log_min_error_statement = 'panic'
log_connections = off
log_disconnections = off
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
search_path = 'pg_catalog'
