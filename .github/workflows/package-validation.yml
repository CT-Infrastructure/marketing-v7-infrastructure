name: Package validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verify before adoption
        with:
          persist-credentials: false
      - name: Validate package and build DAG
        run: python3 tools/validate_scope.py
  cp027-mock-guards:
    name: CP027 mock unit guards (normal and optimized)
    # Fixed Noble private DEB bootstrap; existing dependencies and namespaces fail closed.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing reviewed pin
        with:
          persist-credentials: false
      - name: Run isolated CP027 mock unit guards
        shell: bash
        run: bash .github/scripts/validate-cp027-guards.sh
